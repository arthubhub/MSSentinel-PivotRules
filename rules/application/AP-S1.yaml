id: AP-S1
name: Application usage by IP
indicators: [application]
action: statistics
targets: [ip, account]
description: >
  Sign-ins and calls of the application (AppId, service principal ID or name) over 14 days, by
  source and by IP: service principal, managed identity, users through the application, Microsoft Graph and legacy Azure AD Graph (AADGraphActivityLogs).
  Builds the baseline of usual IPs (CI, servers) and flags the IPs that appeared in the last two days.
  Application sign-ins come from Sentinel or, failing that, from EntraIdSpnSignInEvents (Defender XDR);
  AppOrigin tells whether the application is published by Microsoft, by the tenant or by another tenant.
reading:
  decisive: IP never seen for this application, from a hosting provider or an unusual country, using a client secret.
  context: Sudden increase in Graph calls or authentication failures.
  noise: CI/CD runners whose IPs change, developer workstation testing locally.
v1: true
window: { before: 14d, after: 1d }
uses: [signins, spn_signins]
query: |
  union isfuzzy=true
  (
      _SpnSignins(StartTimestamp, EndTimestamp, ValueApp, "")
      | project TimeGenerated, Source = SignInType, IPAddress, Location, Identity = ServicePrincipalName, AppOrigin,
          Success = Succeeded, Detail = strcat(ResourceDisplayName, " · ", Credential)
  ),
  (
      _Signins(StartTimestamp, EndTimestamp, "", "")
      | where AppId == ValueApp or AppDisplayName =~ ValueApp
      | project TimeGenerated, Source = "Users through the application", IPAddress, Location, Identity = tolower(UserPrincipalName),
          AppOrigin = "", Success = Succeeded, Detail = ResourceDisplayName
  )
  // @sentinel-only:begin
  , (
      MicrosoftGraphActivityLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where AppId == ValueApp or ServicePrincipalId == ValueApp
      | project TimeGenerated, Source = "Microsoft Graph", IPAddress, Location = "", Identity = coalesce(UserId, ServicePrincipalId),
          AppOrigin = "", Success = ResponseStatusCode < 400, Detail = RequestMethod
  ),
  (
      AADGraphActivityLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where AppId == ValueApp or ServicePrincipalId == ValueApp
      | project TimeGenerated, Source = "Azure AD Graph", IPAddress = CallerIpAddress, Location = "", Identity = coalesce(UserId, ServicePrincipalId),
          AppOrigin = "", Success = ResponseStatusCode < 400, Detail = RequestMethod
  )
  // @sentinel-only:end
  | summarize Events = count(), Successes = countif(Success), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      ActiveDays = dcount(bin(TimeGenerated, 1d)), Identities = make_set(Identity, 10), Locations = make_set(Location, 5),
      Details = make_set(Detail, 5), AppOrigin = take_anyif(AppOrigin, isnotempty(AppOrigin)) by Source, IPAddress
  | extend NewIP = FirstSeen > T0 - 2d
  | sort by NewIP desc, Events desc
