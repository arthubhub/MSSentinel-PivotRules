id: AP-P2
name: Service principal sign-ins and calls
indicators: [application]
action: pivot
targets: [ip]
description: >
  Sign-ins of the service principal or managed identity (IP, resource, result, credential type) and
  Microsoft Graph requests (and legacy Azure AD Graph, AADGraphActivityLogs) of the application grouped by method and path (identifiers replaced by {id}).
  Sign-ins read from AADServicePrincipalSignInLogs and AADManagedIdentitySignInLogs, or from EntraIdSpnSignInEvents
  (Defender XDR) when they are missing. In the Defender XDR variant, with no Graph log, the Microsoft 365 activity of
  the application is read from CloudAppEvents (OAuthAppId). AppOrigin tells whether the application is published by Microsoft, by the tenant or by another
  tenant (third-party multi-tenant application).
reading:
  decisive: Successful sign-ins with a client secret from an IP outside the baseline, followed by bulk-read Graph calls (messages, files, users).
  context: High failure rate (secret being tested), unusual resources (Key Vault, Azure Resource Manager).
  noise: Secret rotation, automated deployments.
window: { before: 7d, after: 1d }
uses: [spn_signins]
query: |
  union isfuzzy=true
  (
      _SpnSignins(StartTimestamp, EndTimestamp, ValueApp, "")
      | project TimeGenerated, Source = SignInType, Identity = ServicePrincipalName, AppOrigin, IPAddress, Location,
          Operation = strcat("Sign-in to ", ResourceDisplayName), Result = ResultType, Credential
  )
  // @sentinel-only:begin
  , (
      MicrosoftGraphActivityLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where AppId == ValueApp or ServicePrincipalId == ValueApp
      | project TimeGenerated, Source = "Microsoft Graph", Identity = coalesce(UserId, ServicePrincipalId), AppOrigin = "", IPAddress, Location = "",
          Operation = strcat(RequestMethod, " ", replace_regex(tostring(parse_url(RequestUri).Path), @"[0-9a-fA-F-]{36}", "{id}")),
          Result = tostring(ResponseStatusCode), Credential = ""
  ),
  (
      AADGraphActivityLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where AppId == ValueApp or ServicePrincipalId == ValueApp
      | project TimeGenerated, Source = "Azure AD Graph", Identity = coalesce(UserId, ServicePrincipalId), AppOrigin = "", IPAddress = CallerIpAddress,
          Location = "", Operation = strcat(RequestMethod, " ", replace_regex(tostring(parse_url(RequestUri).Path), @"[0-9a-fA-F-]{36}", "{id}")),
          Result = tostring(ResponseStatusCode), Credential = ""
  )
  // @sentinel-only:end
  // @defender-only:begin
  // Defender XDR: no Graph log; Microsoft 365 activity of the application seen by Defender for Cloud Apps
  , (
      CloudAppEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where OAuthAppId == ValueApp
      | project TimeGenerated, Source = "Defender for Cloud Apps", Identity = coalesce(AccountDisplayName, AccountObjectId), AppOrigin = "",
          IPAddress, Location = CountryCode, Operation = strcat(Application, " · ", ActionType), Result = "", Credential = ""
  )
  // @defender-only:end
  | summarize Events = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), IPs = make_set(IPAddress, 10),
      Locations = make_set(Location, 5), Results = make_set(Result, 5), AppOrigin = take_any(AppOrigin) by Source, Identity, Operation, Credential
  | sort by Source asc, Events desc
