id: PR-T1
name: Timeline du processus
indicators: [process]
action: timeline
description: >
  Déroulé autour de T0 de ce que fait le processus : lancements (avec son parent), enfants, connexions réseau
  (premier contact par destination), fichiers écrits et clés de registre modifiées (Defender for Endpoint), complété
  dans Sentinel par Sysmon (1, 3, 11, 13, 22, 23, 26) et les processus normalisés ASIM. La machine porte son rôle connu (DC, serveur déclaré). Limité à 5 000 lignes.
  Renseigner le contexte HOST pour suivre une seule machine.
reading:
  decisive: Lancement depuis un parent inhabituel → fichier déposé → enfant LOLBin → connexion sortante.
  context: Écriture de clés de persistance par le processus.
  noise: Activité normale d'un processus très répandu (explorer, svchost) sans filtre de machine.
window: { before: 30m, after: 30m }
context: [HOST]
uses: [persistence, roles, sysmon]
query: |
  union isfuzzy=true
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where FileName =~ ValueFile or InitiatingProcessFileName =~ ValueFile
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | project TimeGenerated, Source = "DeviceProcessEvents", Host = tolower(DeviceName), Account = tolower(AccountName),
          Action = iff(FileName =~ ValueFile, strcat("Lancé par ", InitiatingProcessFileName), strcat("Lance ", FileName)),
          Detail = ProcessCommandLine
  ),
  (
      DeviceNetworkEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where InitiatingProcessFileName =~ ValueFile
      | where isempty(ValuePath) or InitiatingProcessFolderPath =~ ValuePath
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | summarize TimeGenerated = min(TimeGenerated), Account = take_any(InitiatingProcessAccountName)
          by DeviceName, Destination = coalesce(RemoteUrl, RemoteIP), RemotePort, ActionType
      | project TimeGenerated, Source = "DeviceNetworkEvents", Host = tolower(DeviceName), Account = tolower(Account),
          Action = strcat("Réseau ", ActionType), Detail = strcat(Destination, ":", tostring(RemotePort))
  ),
  (
      DeviceFileEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where InitiatingProcessFileName =~ ValueFile
      | where isempty(ValuePath) or InitiatingProcessFolderPath =~ ValuePath
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | project TimeGenerated, Source = "DeviceFileEvents", Host = tolower(DeviceName), Account = tolower(InitiatingProcessAccountName),
          Action = strcat("Fichier ", ActionType), Detail = FolderPath
  ),
  (
      DeviceRegistryEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where InitiatingProcessFileName =~ ValueFile
      | where isempty(ValuePath) or InitiatingProcessFolderPath =~ ValuePath
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | project TimeGenerated, Source = "DeviceRegistryEvents", Host = tolower(DeviceName), Account = tolower(InitiatingProcessAccountName),
          Action = strcat(ActionType, iff(_IsPersistenceKey(RegistryKey, RegistryValueName), " (persistance)", "")),
          Detail = strcat(RegistryKey, @"\", RegistryValueName, " = ", RegistryValueData)
  )
  // @sentinel-only:begin
  , (
      ASimProcessEventLogs
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where TargetProcessName has ValueFile or ActingProcessName has ValueFile
      | where tolower(TargetProcessFilename) == ValueFile or tolower(ActingProcessFilename) == ValueFile
      | where isempty(HostFilter) or DvcHostname startswith HostFilter
      | project TimeGenerated, Source = strcat("ASIM ", EventProduct), Host = tolower(DvcHostname), Account = tolower(ActorUsername),
          Action = iff(tolower(TargetProcessFilename) == ValueFile, strcat("Lancé par ", ActingProcessFilename), strcat("Lance ", TargetProcessFilename)),
          Detail = TargetProcessCommandLine
  ),
  (
      _Sysmon(StartTimestampstamp, EndTimestampstamp, dynamic([1, 3, 11, 13, 22, 23, 26]), ValueFile)
      | where ProcessFile == ValueFile or (EventID == 1 and ParentFile == ValueFile)
      | where isempty(ValuePath) or tolower(Image) == ValuePath or tolower(ParentImage) == ValuePath
      | where isempty(HostFilter) or Computer startswith HostFilter
      | project TimeGenerated, Source = strcat("Sysmon ", tostring(EventID)), Host = tolower(Computer), Account = UserSam,
          Action = case(EventID == 1 and ProcessFile == ValueFile, strcat("Lancé par ", ParentFile), EventID == 1, strcat("Lance ", ProcessFile),
              EventName),
          Detail = case(EventID == 1, CommandLine, EventID == 3, strcat(coalesce(DestinationHostname, DestinationIp), ":", DestinationPort),
              EventID == 13, strcat(TargetObject, " = ", Details), EventID == 22, strcat(QueryName, " → ", QueryResults), TargetFilename)
  )
  // @sentinel-only:end
  | extend MachineKey = _HostKey(Host)
  | lookup kind=leftouter (_MachineRoles(EndTimestampstamp)) on MachineKey
  | extend Host = _Labeled(Host, MachineRole)
  | project-away MachineKey, MachineRole, MachineRoleBasis
  | sort by TimeGenerated asc
  | take 5000
