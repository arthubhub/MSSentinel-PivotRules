id: PR-P3
name: Fichiers créés ou modifiés par le processus
indicators: [process]
action: pivot
description: >
  Fichiers créés, modifiés, renommés ou supprimés par le processus : Defender for Endpoint (DeviceFileEvents) et, dans
  Sentinel, accès aux fichiers audités par SACL (4656, 4660, 4663, 4670 : seule source des lectures) et Sysmon (11 fichier
  créé, 15 flux Zone.Identifier avec l'URL d'origine, 23 et 26 suppressions). Par exemple, depuis
  notepad.exe on retrouve les fichiers modifiés ; depuis 7z.exe ou winrar.exe, les archives créées. MachineRole
  donne le rôle connu de la machine (DC, serveur déclaré).
reading:
  decisive: Archive volumineuse créée dans un dossier temporaire ou public avant un transfert sortant, ou exécutable déposé dans AppData.
  context: Fichiers renommés en masse (chiffrement), écriture dans le dossier Démarrage.
  noise: Fichiers temporaires et caches de l'application.
window: { before: 30m, after: 30m }
context: [HOST]
uses: [paths, roles, win_security, sysmon]
query: |
  union isfuzzy=true
  (
      DeviceFileEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where InitiatingProcessFileName =~ ValueFile
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | where isempty(ValuePath) or InitiatingProcessFolderPath =~ ValuePath
      | project TimeGenerated, Source = "DeviceFileEvents", DeviceName = tolower(DeviceName), ActionType, FolderPath, FileName, FileSize,
          SHA256, FileOriginUrl
  )
  // @sentinel-only:begin
  , (
      _WinSecurity(StartTimestampstamp, EndTimestampstamp, dynamic([4656, 4660, 4663, 4670]), ValueFile)
      | where tolower(ProcessName) endswith strcat(@"\", ValueFile)
      | where isempty(ValuePath) or tolower(ProcessName) == ValuePath
      | where isempty(HostFilter) or Computer startswith HostFilter
      | where ObjectType in ("File", "") and isnotempty(ObjectName)
      | project TimeGenerated, Source = SourceTable, DeviceName = tolower(Computer), ActionType = strcat("Audit ", ObjectAccess),
          FolderPath = ObjectName, FileName = tostring(parse_path(ObjectName).Filename), FileSize = long(null), SHA256 = "", FileOriginUrl = ""
  ),
  (
      _Sysmon(StartTimestampstamp, EndTimestampstamp, dynamic([11, 15, 23, 26]), ValueFile)
      | where ProcessFile == ValueFile
      | where isempty(ValuePath) or tolower(Image) == ValuePath
      | where isempty(HostFilter) or Computer startswith HostFilter
      | project TimeGenerated, Source = strcat("Sysmon ", tostring(EventID)), DeviceName = tolower(Computer), ActionType = EventName,
          FolderPath = TargetFilename, FileName = TargetFile, FileSize = long(null), SHA256,
          FileOriginUrl = extract(@"HostUrl=(\S+)", 1, Contents)
  )
  // @sentinel-only:end
  | summarize Events = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), MaxSize = max(FileSize),
      Hashes = make_set_if(SHA256, isnotempty(SHA256), 5), OriginUrls = make_set_if(FileOriginUrl, isnotempty(FileOriginUrl), 5),
      Sources = make_set(Source)
      by DeviceName, ActionType, FolderPath, FileName
  | extend UserWritablePath = _IsUserWritable(FolderPath)
  | extend MachineKey = _HostKey(DeviceName)
  | lookup kind=leftouter (_MachineRoles(EndTimestampstamp)) on MachineKey
  | project-away MachineKey, MachineRoleBasis
  | sort by FirstSeen asc
