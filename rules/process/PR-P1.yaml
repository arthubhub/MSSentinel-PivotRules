id: PR-P1
name: Parents et enfants du processus
indicators: [process]
action: pivot
description: >
  Arbre autour du processus : ses parents et grands-parents (quand il est lancé) et ses enfants (ce qu'il
  lance), avec lignes de commande, machines et comptes. Sources : DeviceProcessEvents, 4688 Windows, Sysmon 1 et
  processus normalisés ASIM (Sysmon, Linux, EDR tiers). Le rôle connu des machines (DC, serveur déclaré) et la
  catégorie des comptes (système, service) sont indiqués entre crochets.
  Par exemple, depuis explorer.exe on voit les exécutables lancés par l'utilisateur ; depuis powershell.exe
  on voit qui l'a lancé et avec quelles options. Si la valeur est un chemin complet, seul ce chemin est retenu.
reading:
  decisive: powershell, mshta ou cmd lancés par explorer ou un navigateur avec une URL ou du Base64 (ClickFix), ou par Office.
  context: Enfant LOLBin (rundll32, regsvr32, certutil, msbuild, node) d'un processus inhabituel.
  noise: Scripts d'administration lancés par les agents de gestion (SCCM, Intune, RMM).
v1: true
window: { before: 30m, after: 30m }
context: [HOST]
uses: [win_security, roles, sysmon]
query: |
  union isfuzzy=true
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where FileName =~ ValueFile or InitiatingProcessFileName =~ ValueFile
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | where isempty(ValuePath) or FolderPath =~ ValuePath or InitiatingProcessFolderPath =~ ValuePath
      | extend Role = iff(FileName =~ ValueFile, "1 · Lancement du processus", "2 · Enfant")
      | project TimeGenerated, Source = "DeviceProcessEvents", DeviceName = tolower(DeviceName), Role,
          GrandParent = tolower(InitiatingProcessParentFileName), Parent = tolower(InitiatingProcessFileName), Process = tolower(FileName),
          CommandLine = ProcessCommandLine, ParentCommandLine = InitiatingProcessCommandLine, Account = tolower(AccountName)
  ),
  (
      _WinSecurity(StartTimestamp, EndTimestamp, dynamic([4688]), ValueFile)
      | where tolower(NewProcessName) endswith strcat(@"\", ValueFile) or tolower(ParentProcessName) endswith strcat(@"\", ValueFile)
      | where isempty(HostFilter) or Computer startswith HostFilter
      | extend Role = iff(tolower(NewProcessName) endswith strcat(@"\", ValueFile), "1 · Lancement du processus", "2 · Enfant")
      | project TimeGenerated, Source = SourceTable, DeviceName = tolower(Computer), Role, GrandParent = "",
          Parent = tolower(tostring(split(ParentProcessName, @"\")[-1])), Process = tolower(tostring(split(NewProcessName, @"\")[-1])),
          CommandLine, ParentCommandLine = "", Account = tolower(SubjectUserName)
  ),
  (
      ASimProcessEventLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where TargetProcessName has ValueFile or ActingProcessName has ValueFile
      | extend _t = tolower(TargetProcessFilename), _p = tolower(ActingProcessFilename)
      | where _t == ValueFile or _p == ValueFile
      | where isempty(HostFilter) or DvcHostname startswith HostFilter
      | where isempty(ValuePath) or tolower(TargetProcessName) == ValuePath or tolower(ActingProcessName) == ValuePath
      | extend Role = iff(_t == ValueFile, "1 · Lancement du processus", "2 · Enfant")
      | project TimeGenerated, Source = strcat("ASIM ", EventProduct), DeviceName = tolower(DvcHostname), Role,
          GrandParent = tolower(tostring(split(replace_string(ParentProcessName, "/", @"\\"), @"\\")[-1])), Parent = _p, Process = _t,
          CommandLine = TargetProcessCommandLine, ParentCommandLine = ActingProcessCommandLine, Account = tolower(ActorUsername)
  ),
  (
      _Sysmon(StartTimestamp, EndTimestamp, dynamic([1]), ValueFile)
      | where ProcessFile == ValueFile or ParentFile == ValueFile
      | where isempty(HostFilter) or Computer startswith HostFilter
      | where isempty(ValuePath) or tolower(Image) == ValuePath or tolower(ParentImage) == ValuePath
      | extend Role = iff(ProcessFile == ValueFile, "1 · Lancement du processus", "2 · Enfant")
      | project TimeGenerated, Source = "Sysmon 1", DeviceName = tolower(Computer), Role, GrandParent = "", Parent = ParentFile,
          Process = ProcessFile, CommandLine, ParentCommandLine, Account = UserSam
  )
  | extend MachineKey = _HostKey(DeviceName)
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | extend DeviceName = _Labeled(DeviceName, MachineRole), Account = _Labeled(Account, _AccountKind(_SamOf(Account)))
  | summarize Executions = count(), Machines = dcount(DeviceName), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      CommandLines = make_set(CommandLine, 5), ParentCommandLines = make_set(ParentCommandLine, 3),
      SampleMachines = make_set(DeviceName, 5), Accounts = make_set(Account, 5) by Role, GrandParent, Parent, Process, Source
  | sort by Role asc, Executions desc
