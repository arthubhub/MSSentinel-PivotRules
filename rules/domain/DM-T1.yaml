id: DM-T1
name: Timeline du domaine
indicators: [domain, url]
action: timeline
description: >
  Déroulé de toutes les traces du domaine autour de T0 : e-mails reçus (avec destinataire), clics, DNS,
  connexions réseau, téléchargements, proxy et pare-feu, et lignes de commande qui le citent. Host porte le rôle connu
  de la machine (DC, serveur déclaré).
reading:
  decisive: E-mail → clic → téléchargement ou commande → connexion d'un processus non navigateur.
  context: Résolutions DNS depuis des machines qui n'ont pas cliqué (propagation, autre vecteur).
  noise: Chargements de ressources tierces par les navigateurs.
window: { before: 30m, after: 30m }
uses: [domain_hits, roles]
query: |
  union isfuzzy=true
  (
      _DomainHits(StartTimestampstamp, EndTimestampstamp, ValueDomain)
      | project TimeGenerated, Source, Host, Account, Action, Detail = Url
  ),
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where ProcessCommandLine has ValueDomain
      | project TimeGenerated, Source = "DeviceProcessEvents", Host = tolower(DeviceName), Account = tolower(AccountName),
          Action = strcat("Processus ", FileName), Detail = strcat(InitiatingProcessFileName, " → ", ProcessCommandLine)
  )
  | extend MachineKey = _HostKey(Host)
  | lookup kind=leftouter (_MachineRoles(EndTimestampstamp)) on MachineKey
  | extend Host = _Labeled(Host, MachineRole)
  | project-away MachineKey, MachineRole, MachineRoleBasis
  | sort by TimeGenerated asc
