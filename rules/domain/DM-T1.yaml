id: DM-T1
name: Domain timeline
indicators: [domain, url]
action: timeline
targets: [device, account, process]
description: >
  Sequence of all traces of the domain around T0: received emails (with recipient), clicks, DNS, network
  connections, downloads, proxy and firewall, and command lines that mention it. Host carries the known role of the
  device (DC, declared server).
reading:
  decisive: Email → click → download or command → connection by a non-browser process.
  context: DNS resolutions from devices that did not click (spread, other vector).
  noise: Third-party resources loaded by browsers.
window: { before: 30m, after: 30m }
uses: [domain_hits, roles]
query: |
  union isfuzzy=true
  (
      _DomainHits(StartTimestamp, EndTimestamp, ValueDomain)
      | project TimeGenerated, Source, Host, Account, Action, Detail = Url
  ),
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where ProcessCommandLine has ValueDomain
      | project TimeGenerated, Source = "DeviceProcessEvents", Host = tolower(DeviceName), Account = tolower(AccountName),
          Action = strcat("Process ", FileName), Detail = strcat(InitiatingProcessFileName, " → ", ProcessCommandLine)
  )
  | extend MachineKey = _HostKey(Host)
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | extend Host = _Labeled(Host, MachineRole)
  | project-away MachineKey, MachineRole, MachineRoleBasis
  | sort by TimeGenerated asc
