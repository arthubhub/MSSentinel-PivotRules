id: DM-P2
name: Emails containing the domain
indicators: [domain, url]
action: pivot
targets: [email, url]
description: >
  Emails with a URL pointing to the domain (EmailUrlInfo + EmailEvents), grouped by message: sender, subject,
  recipients, delivery and detected threats.
reading:
  decisive: Same message delivered to the inbox of many recipients.
  context: New external sender, subject imitating a brand (Booking, DocuSign, Microsoft).
  noise: Legitimate newsletters that mention the domain.
window: { before: 7d, after: 1d }
uses: [web_functions]
query: |
  EmailUrlInfo
  | where TimeGenerated between (StartTimestamp .. EndTimestamp)
  | where UrlDomain has ValueDomain
  | where _InDomain(tolower(UrlDomain), ValueDomain)
  | summarize Urls = make_set(Url, 5) by NetworkMessageId
  | join kind=inner (
      EmailEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | project NetworkMessageId, TimeGenerated, SenderFromAddress, RecipientEmailAddress, Subject, DeliveryAction,
          LatestDeliveryLocation, ThreatTypes, EmailDirection
      ) on NetworkMessageId
  | summarize FirstSeen = min(TimeGenerated), RecipientCount = dcount(RecipientEmailAddress), Recipients = make_set(RecipientEmailAddress, 50),
      Urls = take_any(Urls), Actions = make_set(DeliveryAction), Locations = make_set(LatestDeliveryLocation),
      Threats = make_set_if(ThreatTypes, isnotempty(ThreatTypes)), Direction = take_any(EmailDirection)
      by NetworkMessageId, SenderFromAddress, Subject
  | sort by FirstSeen asc
