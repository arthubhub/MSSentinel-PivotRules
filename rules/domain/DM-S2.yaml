id: DM-S2
name: Domain prevalence
indicators: [domain, url]
action: statistics
description: >
  First and last appearance of the domain over 30 days, number of distinct devices and accounts, per source and in
  total, with the subdomains seen and the number of exact matches of the selected URL.
reading:
  decisive: Domain seen for the first time in the window, on 1 to 3 devices, name close to a known brand.
  context: Random or very long subdomains (algorithmic generation, DNS tunnel).
  noise: New SaaS services adopted by a team, CDN domains.
v1: true
window: { before: 30d, after: 1d }
uses: [domain_hits]
query: |
  let Hits = materialize(_DomainHits(StartTimestamp, EndTimestamp, ValueDomain) | extend Fqdn = _Host(Url));
  union
  (
      Hits
      | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Events = count(),
          Machines = dcountif(Host, isnotempty(Host)), Accounts = dcountif(Account, isnotempty(Account)),
          ExactUrlHits = countif(Url =~ ValueUrl), Subdomains = make_set(Fqdn, 20) by Source
  ),
  (
      Hits
      | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Events = count(),
          Machines = dcountif(Host, isnotempty(Host)), Accounts = dcountif(Account, isnotempty(Account)),
          ExactUrlHits = countif(Url =~ ValueUrl), Subdomains = make_set(Fqdn, 20)
      | extend Source = "Total"
  )
  | extend NewInWindow = FirstSeen > T0 - 2d
  | project Source, NewInWindow, FirstSeen, LastSeen, Events, Machines, Accounts, ExactUrlHits, Subdomains
  | sort by Source == "Total" desc, Events desc
