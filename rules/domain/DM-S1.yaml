id: DM-S1
name: Occurrences du domaine par jour et par source
indicators: [domain, url]
action: statistics
description: >
  Nombre de traces du domaine (et de ses sous-domaines) par jour et par source : clics, URL d'e-mails et de
  messages Teams, connexions Defender, origine de fichiers, DNS (DnsEvents, ASimDnsActivityLogs) et proxy (CEF).
  Pour une URL, c'est son domaine qui est compté.
reading:
  decisive: Domaine absent jusqu'à la veille puis présent dans plusieurs sources le jour de l'alerte.
  context: Activité DNS qui continue après le blocage des clics (machine infectée qui rappelle).
  noise: Domaines de CDN, d'analytique ou de régie publicitaire présents tous les jours.
window: { before: 14d, after: 1d }
render: timechart
uses: [domain_hits]
query: |
  _DomainHits(StartTime, EndTime, ValueDomain)
  | summarize Events = count() by bin(TimeGenerated, 1d), Source
  | render timechart
