id: DM-S1
name: Domain occurrences per day and source
indicators: [domain, url]
action: statistics
description: >
  Number of traces of the domain (and its subdomains) per day and per source: clicks, URLs in emails and Teams
  messages, Defender connections, file origins, DNS (DnsEvents, ASimDnsActivityLogs, Defender for Endpoint DNS
  responses) and proxy or firewall (CEF, ASIM web, Azure Firewall).
  For a URL, its domain is counted.
reading:
  decisive: Domain absent until the day before, then present in several sources on the day of the alert.
  context: DNS activity that continues after clicks are blocked (infected device calling back).
  noise: CDN, analytics or ad network domains present every day.
window: { before: 14d, after: 1d }
render: timechart
uses: [domain_hits]
query: |
  _DomainHits(StartTimestamp, EndTimestamp, ValueDomain)
  | summarize Events = count() by bin(TimeGenerated, 1d), Source
  | render timechart
