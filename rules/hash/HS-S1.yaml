id: HS-S1
name: Hash prevalence
indicators: [hash]
action: statistics
targets: [device]
description: >
  Presence of the file (MD5, SHA1 or SHA256) over 30 days, by source: files written, processes started,
  DLLs loaded, Defender events and email attachments (SHA256 only). Gives devices, names
  and paths, and a total row. In Sentinel, adds Sysmon (1, 7, 15, 23, 26, 29), ASIM normalized files and processes and
  downloads seen by the proxy (ASimWebSessionLogs, CommonSecurityLog). The HOST context narrows the search to one device.
reading:
  decisive: File seen on a single device, under a known software name, in a user folder.
  context: Same hash received as an attachment then executed on several devices.
  noise: Binaries of recent updates, not yet widespread.
window: { before: 30d, after: 1d }
context: [HOST]
uses: [sysmon]
query: |
  let H = materialize(union isfuzzy=true
  (
      union isfuzzy=true withsource=Source DeviceFileEvents, DeviceProcessEvents, DeviceImageLoadEvents, DeviceEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where SHA256 == ValueHash or SHA1 == ValueHash or MD5 == ValueHash
      | where isempty(HostFilter) or DeviceName startswith HostFilter
      | project TimeGenerated, Source, DeviceName = tolower(DeviceName), FileName, FolderPath
  ),
  (
      EmailAttachmentInfo
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where SHA256 == ValueHash
      | project TimeGenerated, Source = "EmailAttachmentInfo", DeviceName = tolower(RecipientEmailAddress), FileName, FolderPath = ""
  )
  // @sentinel-only:begin
  , (
      ASimFileEventLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where TargetFileSHA256 =~ ValueHash or TargetFileSHA1 =~ ValueHash or TargetFileMD5 =~ ValueHash
      | where isempty(HostFilter) or DvcHostname startswith HostFilter
      | project TimeGenerated, Source = "ASimFileEventLogs", DeviceName = tolower(DvcHostname), FileName = TargetFileName, FolderPath = TargetFilePath
  ),
  (
      ASimProcessEventLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where TargetProcessSHA256 =~ ValueHash or TargetProcessSHA1 =~ ValueHash or TargetProcessMD5 =~ ValueHash
      | where isempty(HostFilter) or DvcHostname startswith HostFilter
      | project TimeGenerated, Source = "ASimProcessEventLogs", DeviceName = tolower(DvcHostname), FileName = TargetProcessFilename,
          FolderPath = TargetProcessName
  ),
  (
      ASimWebSessionLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where FileSHA256 =~ ValueHash or FileSHA1 =~ ValueHash or FileMD5 =~ ValueHash
      | project TimeGenerated, Source = "ASimWebSessionLogs", DeviceName = tolower(coalesce(SrcHostname, SrcIpAddr)), FileName, FolderPath = Url
  ),
  (
      CommonSecurityLog
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where FileHash =~ ValueHash
      | project TimeGenerated, Source = "CommonSecurityLog", DeviceName = tolower(coalesce(SourceHostName, SourceIP)), FileName, FolderPath = FilePath
  ),
  (
      _Sysmon(StartTimestamp, EndTimestamp, dynamic([1, 7, 15, 23, 26, 29]), ValueHash)
      | where SHA256 == ValueHash or SHA1 == ValueHash or MD5 == ValueHash
      | where isempty(HostFilter) or Computer startswith HostFilter
      | extend Path = case(EventID == 1, Image, EventID == 7, ImageLoaded, TargetFilename)
      | project TimeGenerated, Source = strcat("Sysmon ", tostring(EventID)), DeviceName = tolower(Computer), FileName = tolower(tostring(split(Path, @"\")[-1])),
          FolderPath = Path
  )
  // @sentinel-only:end
  );
  union
  (
      H
      | summarize Events = count(), Machines = dcount(DeviceName), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
          FileNames = make_set(FileName, 10), Paths = make_set(FolderPath, 10) by Source
  ),
  (
      H
      | summarize Events = count(), Machines = dcount(DeviceName), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
          FileNames = make_set(FileName, 10), Paths = make_set(FolderPath, 10)
      | extend Source = "Total"
  )
  | project Source, Events, Machines, FirstSeen, LastSeen, FileNames, Paths
  | sort by Source == "Total" desc, Events desc
