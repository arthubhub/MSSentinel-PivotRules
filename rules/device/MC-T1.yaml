id: MC-T1
name: Timeline de la machine
indicators: [device]
action: timeline
description: >
  Déroulé autour de T0 sur la machine : processus, premier contact avec chaque destination publique, fichiers
  exécutables, scripts et archives écrits, ouvertures de session, clés de persistance, événements Defender
  notables (antivirus, ASR, altération, injection, tâches, services), alertes et événements Windows clés
  (4624, 4625, 4672, 4688, 4697, 4698, 4720, 4732), accès vus par Defender for Identity, processus et
  authentifications des journaux ASIM, Sysmon (processus, connexions, fichiers, registre, DNS), fichiers modifiés ou
  supprimés et partages accédés selon l'audit Windows (4660, 4663, 5145), et journaux Linux notables (SSH, sudo,
  erreurs). Limité à 5 000 lignes.
reading:
  decisive: Enchaînement processus inhabituel → fichier déposé → persistance → connexion sortante, avec alerte associée.
  context: Ouverture de session distante juste avant l'activité suspecte (mouvement latéral entrant).
  noise: Activité de fond (mises à jour, agents de gestion, antivirus).
v1: true
window: { before: 30m, after: 30m }
uses: [persistence, win_security, sysmon]
query: |
  let Notable = dynamic(["Antivirus", "Asr", "Tamper", "Injection", "ScheduledTask", "ServiceInstalled", "Exploit",
      "SmartScreen", "PowerShellCommand", "Amsi", "Wmi", "Lsass", "Credential"]);
  union isfuzzy=true
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | project TimeGenerated, Source = "DeviceProcessEvents", Host = tolower(DeviceName), Account = tolower(AccountName),
          Action = strcat("Processus ", FileName), Detail = strcat(InitiatingProcessFileName, " → ", ProcessCommandLine)
  ),
  (
      DeviceNetworkEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | where RemoteIPType == "Public"
      | summarize TimeGenerated = min(TimeGenerated), Account = take_any(InitiatingProcessAccountName)
          by DeviceName, InitiatingProcessFileName, Destination = coalesce(RemoteUrl, RemoteIP), RemotePort
      | project TimeGenerated, Source = "DeviceNetworkEvents", Host = tolower(DeviceName), Account = tolower(Account),
          Action = strcat("Premier contact · ", InitiatingProcessFileName), Detail = strcat(Destination, ":", tostring(RemotePort))
  ),
  (
      DeviceFileEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | where FileName matches regex @"(?i)\.(exe|dll|sys|ps1|psm1|bat|cmd|vbs|vbe|js|jse|wsf|hta|msi|lnk|scr|zip|iso|img|rar|7z)$"
      | project TimeGenerated, Source = "DeviceFileEvents", Host = tolower(DeviceName), Account = tolower(InitiatingProcessAccountName),
          Action = strcat("Fichier ", ActionType), Detail = strcat(FolderPath, " ← ", InitiatingProcessFileName, iff(isempty(FileOriginUrl), "", strcat(" ← ", FileOriginUrl)))
  ),
  (
      DeviceLogonEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | project TimeGenerated, Source = "DeviceLogonEvents", Host = tolower(DeviceName), Account = tolower(strcat(AccountDomain, @"\", AccountName)),
          Action = strcat(ActionType, " ", LogonType), Detail = strcat(RemoteIP, " ", RemoteDeviceName)
  ),
  (
      DeviceRegistryEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | where _IsPersistenceKey(RegistryKey, RegistryValueName)
      | project TimeGenerated, Source = "DeviceRegistryEvents", Host = tolower(DeviceName), Account = tolower(InitiatingProcessAccountName),
          Action = ActionType, Detail = strcat(RegistryKey, @"\", RegistryValueName, " = ", RegistryValueData)
  ),
  (
      DeviceEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | where ActionType has_any (Notable)
      | project TimeGenerated, Source = "DeviceEvents", Host = tolower(DeviceName), Account = tolower(InitiatingProcessAccountName),
          Action = ActionType, Detail = strcat(FileName, " · ", InitiatingProcessFileName, " · ", substring(tostring(AdditionalFields), 0, 300))
  ),
  (
      AlertEvidence
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DeviceName startswith ValueShort and _IsHost(DeviceName)
      | summarize arg_min(TimeGenerated, Title, Severity, DeviceName) by AlertId
      | project TimeGenerated, Source = "AlertEvidence", Host = tolower(DeviceName), Account = "",
          Action = strcat("Alerte ", Severity), Detail = Title
  ),
  (
      IdentityLogonEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where TargetDeviceName has ValueShort or DeviceName has ValueShort
      | where _IsHost(TargetDeviceName) or _IsHost(DeviceName)
      | project TimeGenerated, Source = "IdentityLogonEvents", Host = ValueShort, Account = tolower(coalesce(AccountUpn, AccountName)),
          Action = strcat(iff(_IsHost(TargetDeviceName), "Accès entrant ", "Authentification sortante "), Protocol, " ", ActionType),
          Detail = strcat(DeviceName, " → ", coalesce(TargetDeviceName, DestinationDeviceName), " · ", LogonType)
  ),
  // @sentinel-only:begin
  (
      ASimProcessEventLogs
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where DvcHostname startswith ValueShort and _IsHost(DvcHostname)
      | project TimeGenerated, Source = strcat("ASIM ", EventProduct), Host = tolower(DvcHostname), Account = tolower(ActorUsername),
          Action = strcat("Processus ", tostring(split(replace_string(TargetProcessName, "/", @"\"), @"\")[-1])),
          Detail = strcat(ParentProcessName, " → ", TargetProcessCommandLine)
  ),
  (
      ASimAuthenticationEventLogs
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where TargetHostname has ValueShort or DvcHostname has ValueShort
      | where _IsHost(coalesce(TargetHostname, DvcHostname))
      | project TimeGenerated, Source = strcat("ASIM ", EventProduct), Host = ValueShort, Account = tolower(TargetUsername),
          Action = strcat(EventType, " ", EventResult), Detail = strcat("depuis ", coalesce(SrcHostname, SrcIpAddr), " · ", LogonProtocol)
  ),
  (
      Syslog
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where Computer startswith ValueShort and _IsHost(Computer)
      | where ProcessName in~ ("sshd", "sshd-session", "sudo", "su", "useradd", "usermod", "crontab")
          or SeverityLevel in ("emerg", "alert", "crit", "err")
      | project TimeGenerated, Source = strcat("Syslog (", ProcessName, ")"), Host = tolower(Computer), Account = "",
          Action = strcat(Facility, ".", SeverityLevel), Detail = substring(SyslogMessage, 0, 300)
  ),
  (
      _Sysmon(StartTimestampstamp, EndTimestampstamp, dynamic([1, 3, 11, 13, 22, 23, 26]), ValueShort)
      | where _IsHost(Computer)
      | where EventID != 3 or Initiated == "true"
      | project TimeGenerated, Source = strcat("Sysmon ", tostring(EventID)), Host = tolower(Computer), Account = UserSam,
          Action = case(EventID == 1, strcat("Processus ", ProcessFile), strcat(EventName, " · ", ProcessFile)),
          Detail = case(EventID == 1, strcat(ParentFile, " → ", CommandLine), EventID == 3, strcat(coalesce(DestinationHostname, DestinationIp), ":", DestinationPort),
              EventID == 13, strcat(TargetObject, " = ", Details), EventID == 22, strcat(QueryName, " → ", QueryResults), TargetFilename)
  ),
  (
      _WinSecurity(StartTimestampstamp, EndTimestampstamp, dynamic([4660, 4663, 5145]), ValueShort)
      | where _IsHost(Computer)
      | where EventID == 5145 or ObjectAccess has_any ("écriture", "suppression", "permissions")
      | project TimeGenerated, Source = SourceTable, Host = tolower(Computer), Account = SubjectSam,
          Action = strcat(tostring(EventID), " · ", EventName, " (", ObjectAccess, ")"),
          Detail = iff(EventID == 5145, strcat(ShareName, @"\", RelativeTargetName, " depuis ", IpAddress), strcat(ObjectName, " · ", ProcessName))
  ),
  // @sentinel-only:end
  (
      _WinSecurity(StartTimestampstamp, EndTimestampstamp, dynamic([4624, 4625, 4672, 4688, 4697, 4698, 4720, 4732]), ValueShort)
      | where _IsHost(Computer)
      | where EventID == 4688 or not(TargetUserName endswith "$" or SubjectUserName endswith "$")
      | project TimeGenerated, Source = SourceTable, Host = tolower(Computer),
          Account = tolower(iff(EventID in (4672, 4688, 4697, 4698), SubjectUserName, TargetUserName)),
          Action = strcat(tostring(EventID), " · ", EventName),
          Detail = case(EventID == 4688, strcat(ParentProcessName, " → ", CommandLine),
              EventID in (4624, 4625), strcat(LogonTypeName, " · ", IpAddress, " ", WorkstationName),
              EventID == 4698, TaskName, EventID == 4697, strcat(ServiceName, " · ", ServiceFileName), "")
  )
  | sort by TimeGenerated asc
  | take 5000
