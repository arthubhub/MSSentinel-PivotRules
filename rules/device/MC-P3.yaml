id: MC-P3
name: Persistence installed on the device
indicators: [device]
action: pivot
targets: [process]
description: >
  Persistence mechanisms created or modified: Run, RunOnce, Winlogon, IFEO registry keys and service ImagePath
  (DeviceRegistryEvents), scheduled tasks and services (DeviceEvents), schtasks, sc, reg, wmic and PowerShell commands
  (DeviceProcessEvents), Startup folder shortcuts (DeviceFileEvents) and Windows events 4697, 4698, 4702, 4720, 4732
  (SecurityEvent and WindowsEvent).
reading:
  decisive: Task or Run key pointing to a file dropped in AppData, Temp or ProgramData within the hour.
  context: Task named after a system component (GoogleUpdate, OneDrive) but with an unsigned binary or outside its folder.
  noise: Installs and updates of signed software, tasks created by IT.
v1: true
window: { before: 1h, after: 24h }
uses: [persistence, win_security, paths, sysmon]
query: |
  union isfuzzy=true
  (
      DeviceRegistryEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where DeviceName startswith ValueShort
      | where _IsHost(DeviceName)
      | where ActionType in ("RegistryValueSet", "RegistryKeyCreated")
      | where _IsPersistenceKey(RegistryKey, RegistryValueName)
      | project TimeGenerated, Mechanism = "Registry", Item = strcat(RegistryKey, @"\", RegistryValueName), Detail = RegistryValueData,
          Process = InitiatingProcessFileName, CommandLine = InitiatingProcessCommandLine
  ),
  (
      DeviceEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where DeviceName startswith ValueShort
      | where _IsHost(DeviceName)
      | where ActionType in (_PersistenceActions)
      | extend AF = parse_json(tostring(AdditionalFields))
      | project TimeGenerated, Mechanism = ActionType, Item = coalesce(tostring(AF.TaskName), tostring(AF.ServiceName), FileName),
          Detail = substring(coalesce(tostring(AF.TaskContent), FolderPath, tostring(AF)), 0, 1000),
          Process = InitiatingProcessFileName, CommandLine = InitiatingProcessCommandLine
  ),
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where DeviceName startswith ValueShort
      | where _IsHost(DeviceName)
      | where (FileName in~ ("schtasks.exe", "at.exe") and ProcessCommandLine has "/create")
          or (FileName =~ "sc.exe" and ProcessCommandLine has_any ("create", "config"))
          or (FileName =~ "reg.exe" and ProcessCommandLine has "add" and ProcessCommandLine has_any ("CurrentVersion\\Run", "Winlogon", "Image File Execution Options"))
          or (FileName in~ ("powershell.exe", "pwsh.exe", "wmic.exe") and ProcessCommandLine has_any ("Register-ScheduledTask", "New-ScheduledTask", "New-Service", "__EventFilter", "CommandLineEventConsumer"))
      | project TimeGenerated, Mechanism = "Command", Item = FileName, Detail = ProcessCommandLine,
          Process = InitiatingProcessFileName, CommandLine = InitiatingProcessCommandLine
  ),
  (
      DeviceFileEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where DeviceName startswith ValueShort
      | where _IsHost(DeviceName)
      | where ActionType == "FileCreated" and FolderPath has @"\Start Menu\Programs\Startup"
      | project TimeGenerated, Mechanism = "Startup folder", Item = FileName, Detail = FolderPath,
          Process = InitiatingProcessFileName, CommandLine = InitiatingProcessCommandLine
  )
  // @sentinel-only:begin
  , (
      _WinSecurity(StartTimestamp, EndTimestamp, dynamic([4697, 4698, 4702, 4720, 4732]), ValueShort)
      | where _IsHost(Computer)
      | project TimeGenerated, Mechanism = strcat(tostring(EventID), " ", EventName),
          Item = coalesce(TaskName, ServiceName, TargetUserName),
          Detail = substring(coalesce(TaskContent, ServiceFileName, MemberName), 0, 1000),
          Process = strcat(SubjectDomainName, @"\", SubjectUserName), CommandLine = ""
  ),
  (
      _WinSecurity(StartTimestamp, EndTimestamp, dynamic([4657]), ValueShort)
      | where _IsHost(Computer)
      | where _IsPersistenceKey(ObjectName, ObjectValueName)
      | project TimeGenerated, Mechanism = "4657 · Registry (Windows audit)", Item = strcat(ObjectName, @"\", ObjectValueName), Detail = ObjectAccess,
          Process = ProcessName, CommandLine = ""
  ),
  (
      _Sysmon(StartTimestamp, EndTimestamp, dynamic([12, 13, 14]), ValueShort)
      | where _IsHost(Computer)
      | extend ValueName = tostring(split(TargetObject, @"\")[-1])
      | where _IsPersistenceKey(TargetObject, ValueName)
      | project TimeGenerated, Mechanism = strcat("Registry (Sysmon ", tostring(EventID), ")"), Item = TargetObject, Detail = Details,
          Process = ProcessFile, CommandLine = ""
  ),
  (
      union isfuzzy=true
      (Event | where TimeGenerated between (StartTimestamp .. EndTimestamp) | where Source == "Service Control Manager" and EventID == 7045
          | where Computer startswith ValueShort and _IsHost(Computer)
          | project TimeGenerated, ServiceName = XMLFIELD(EventData, ServiceName), ImagePath = XMLFIELD(EventData, ImagePath),
              Account = XMLFIELD(EventData, AccountName)),
      (WindowsEvent | where TimeGenerated between (StartTimestamp .. EndTimestamp) | where Provider == "Service Control Manager" and EventID == 7045
          | where Computer startswith ValueShort and _IsHost(Computer)
          | project TimeGenerated, ServiceName = tostring(EventData.ServiceName), ImagePath = tostring(EventData.ImagePath),
              Account = tostring(EventData.AccountName))
      | project TimeGenerated, Mechanism = "7045 · Service installed (System log)", Item = ServiceName, Detail = ImagePath,
          Process = Account, CommandLine = ""
  )
  // @sentinel-only:end
  | extend UserWritablePath = _IsUserWritable(Detail)
  | sort by TimeGenerated asc
