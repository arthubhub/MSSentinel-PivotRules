id: MC-P1
name: Accounts that logged on to the device
indicators: [device]
action: pivot
targets: [account, ip]
description: >
  Accounts that accessed or tried to access the device, sorted by kind of access (Perspective column):
  "Session on the device" (Defender for Endpoint, 4624 and 4625 from the device, ASIM, Linux SSH), "Explicit
  credentials to the device" (4648 logged on the source workstation), "Kerberos service ticket" (4769 logged by the
  domain controller for a service of the device: the only trace when the device does not send its logs) and "Access
  seen by Defender for Identity". If the device is a domain controller, its network logons (GPO, SYSVOL, LDAP, made by
  every account of the domain) are ranked separately, last. Gives logon type, source IP and workstation, local admin
  rights and known role of the account. Machine accounts and system accounts are excluded.
reading:
  decisive: Account unknown to the device in RemoteInteractive (RDP) or network logon, from a user workstation; unexpected privileged account.
  context: Local admin account used for the first time; 4769 tickets without a matching session (device logs missing).
  noise: Service, inventory and backup accounts with network or service logons; network access to a DC.
window: { before: 24h, after: 1h }
uses: [win_security, roles]
query: |
  let IsDc = toscalar(_MachineRoles(EndTimestamp) | where MachineKey == ValueShort | summarize countif(MachineRole has "DC")) > 0;
  union isfuzzy=true
  (
      DeviceLogonEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where DeviceName startswith ValueShort
      | where _IsHost(DeviceName)
      | project TimeGenerated, Account = tolower(strcat(AccountDomain, @"\", AccountName)), Perspective = "Session on the device",
          Source = "DeviceLogonEvents", LogonType, Success = ActionType == "LogonSuccess", SourceIp = RemoteIP,
          SourceHost = tolower(RemoteDeviceName), IsLocalAdmin
  ),
  // @sentinel-only:begin
  (
      _WinSecurity(StartTimestamp, EndTimestamp, dynamic([4624, 4625, 4648, 4769]), ValueShort)
      | where _IsHost(TargetHost)
      | project TimeGenerated,
          Account = iff(isempty(TargetDomainName) or TargetDomainName == "-", TargetSam, strcat(tolower(tostring(split(TargetDomainName, ".")[0])), @"\", TargetSam)),
          Perspective = case(EventID == 4648, "Explicit credentials to the device", EventID == 4769, "Kerberos service ticket (seen by the DC)",
              "Session on the device"),
          Source = SourceTable, LogonType = case(EventID == 4648, "Explicit credentials (4648)", EventID == 4769, strcat("Kerberos · ", ServiceName), LogonTypeName),
          Success = EventID != 4625 and Status in ("", "-", "0x0"), SourceIp = IpAddress,
          SourceHost = iff(EventID == 4648, tolower(Computer), tolower(WorkstationName)), IsLocalAdmin = bool(null)
  ),
  // @sentinel-only:end
  (
      IdentityLogonEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where TargetDeviceName startswith ValueShort and _IsHost(TargetDeviceName)
      | project TimeGenerated, Account = tolower(coalesce(AccountUpn, AccountName)), Perspective = "Access seen by Defender for Identity",
          Source = "IdentityLogonEvents", LogonType = strcat(Protocol, " ", LogonType), Success = ActionType == "LogonSuccess",
          SourceIp = IPAddress, SourceHost = tolower(DeviceName), IsLocalAdmin = bool(null)
  )
  // @sentinel-only:begin
  , (
      ASimAuthenticationEventLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where TargetHostname has ValueShort or DvcHostname has ValueShort
      | where _IsHost(coalesce(TargetHostname, DvcHostname))
      | project TimeGenerated, Account = tolower(TargetUsername), Perspective = "Session on the device", Source = strcat("ASIM ", EventProduct),
          LogonType = strcat(LogonProtocol, " ", LogonMethod), Success = EventResult == "Success", SourceIp = SrcIpAddr,
          SourceHost = tolower(SrcHostname), IsLocalAdmin = bool(null)
  ),
  (
      Syslog
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where Computer startswith ValueShort and _IsHost(Computer)
      | where ProcessName in~ ("sshd", "sshd-session")
      | extend User = extract(@"(?:Accepted|Failed) \S+ for (?:invalid user )?(\S+) from", 1, SyslogMessage)
      | where isnotempty(User)
      | project TimeGenerated, Account = tolower(User), Perspective = "Session on the device", Source = "Syslog (sshd)", LogonType = "SSH",
          Success = SyslogMessage startswith "Accepted", SourceIp = extract(@" from (\S+)", 1, SyslogMessage), SourceHost = "", IsLocalAdmin = bool(null)
  )
  // @sentinel-only:end
  | where not(Account endswith "$")
  | where not(Account has_any (@"nt authority\", @"window manager\", @"font driver host\", @"nt service\"))
  | extend Perspective = iff(IsDc and Perspective == "Session on the device" and LogonType has "Network",
      "Network access to the domain controller (GPO, SYSVOL, LDAP)", Perspective)
  | extend Rank = case(Perspective startswith "Session", 1, Perspective startswith "Explicit", 2, Perspective startswith "Kerberos", 3,
      Perspective startswith "Access seen", 4, 5)
  | summarize Logons = count(), Failures = countif(not(Success)), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      LogonTypes = make_set(LogonType, 10), SourceIps = make_set_if(SourceIp, isnotempty(SourceIp), 10),
      SourceHosts = make_set_if(SourceHost, isnotempty(SourceHost), 10), Sources = make_set(Source),
      LocalAdmin = max(toint(IsLocalAdmin)) by Account, Perspective, Rank
  | extend AccountKey = _SamOf(Account)
  | lookup kind=leftouter (_AccountRoles(EndTimestamp)) on AccountKey
  | extend AccountRole = _JoinRoles(_AccountKind(AccountKey), AccountRole)
  | sort by Rank asc, FirstSeen asc
  | project Account, AccountRole, Perspective, Logons, Failures, FirstSeen, LastSeen, LogonTypes, SourceIps, SourceHosts, LocalAdmin, Sources
