id: IP-S3
name: Daily usage by device
indicators: [ip]
action: statistics
targets: [device]
description: >
  Device × day cross-table of the number of events where the IP appears (Defender network connections,
  Windows logs, Defender for Identity, firewall, Linux). The device is the actual target of the event: a domain
  controller that only validated credentials (4768, 4769, 4771, 4776) appears separately, with the suffix "credential
  validation". The known role of each device (DC, server declared in the watchlist) is shown in brackets.
reading:
  decisive: Devices touched only on the day of the alert, while the IP already existed before.
  context: Number of devices growing from one day to the next (scanning, lateral movement).
  noise: Monitoring, inventory or backup servers contacted every day; "credential validation" rows of DCs.
window: { before: 7d, after: 1d }
uses: [ip_events, roles]
query: |
  _IpEvents(StartTimestamp, EndTimestamp, Value)
  | where isnotempty(Host) or isnotempty(AuthBy)
  | extend MachineKey = _HostKey(coalesce(Host, AuthBy))
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | extend Machine = _Labeled(iff(isnotempty(Host), Host, strcat(AuthBy, " · credential validation")), MachineRole)
  | summarize Events = count() by Machine, Day = format_datetime(bin(TimeGenerated, 1d), "yyyy-MM-dd")
  | evaluate pivot(Day, sum(Events), Machine)
