id: IP-S1
name: IP activity per day
indicators: [ip]
action: statistics
description: >
  Number of events containing the IP per day and per table (Entra ID users and applications, Microsoft Graph,
  Windows, Defender, Microsoft 365, Azure, firewall and proxy, email, Linux). Shows whether the IP is new, dormant or
  usual. A missing table does not appear: see IP-S0 to know which tables are populated.
reading:
  decisive: First appearance in the last 24 hours after several days of absence.
  context: Sudden change in volume or appearance in a new table (for example Azure after Entra ID).
  noise: Corporate proxy, NAT or VPN IPs present every day in every table.
window: { before: 7d, after: 1d }
render: timechart
uses: [ip_events]
query: |
  _IpEvents(StartTimestamp, EndTimestamp, Value)
  | summarize Events = count() by bin(TimeGenerated, 1d), Source
  | render timechart
