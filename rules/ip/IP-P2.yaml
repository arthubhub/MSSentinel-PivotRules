id: IP-P2
name: Accounts signed in from the IP
indicators: [ip]
action: pivot
targets: [account]
description: >
  Accounts and identities that tried to authenticate from the IP: Entra ID (users, applications and managed
  identities), Windows (4624, 4625, 4648, 4768, 4769, 4771, 4776 via SecurityEvent and WindowsEvent), Defender for Endpoint,
  Defender for Identity, ASIM authentication logs and Linux SSH logons (Syslog). Gives attempts, successes, failures,
  first success, the devices actually targeted (Targets, with their role) apart from the domain controllers that only
  validated the credentials (ValidatedBy), and the known role of the account.
reading:
  decisive: A success preceded by failures on many accounts from the same IP (successful spray), or a privileged account among them.
  context: Several accounts from the same phishing campaign signed in from the same IP; 4769 ticket to an unusual server.
  noise: NAT, VPN or Citrix server IP that carries hundreds of legitimate accounts (see IP-P6).
v1: true
window: { before: 24h, after: 1h }
uses: [signins, spn_signins, win_security, roles]
query: |
  union isfuzzy=true
  (
      _Signins(StartTimestamp, EndTimestamp, Value, "")
      | project TimeGenerated, Account = tolower(UserPrincipalName), Source = strcat("Entra ID ", SignInType),
          Success = Succeeded, Target = "", AuthBy = "", App = AppDisplayName, Detail = iff(Succeeded, Location, strcat(ResultType, " ", FailureReason))
  ),
  (
      _SpnSignins(StartTimestamp, EndTimestamp, "", Value)
      | project TimeGenerated, Account = tolower(ServicePrincipalName), Source = strcat("Entra ID ", SignInType),
          Success = Succeeded, Target = "", AuthBy = "", App = ResourceDisplayName, Detail = strcat(Credential, " ", ResultType)
  ),
  // @sentinel-only:begin
  (
      _WinSecurity(StartTimestamp, EndTimestamp, dynamic([4624, 4625, 4648, 4768, 4769, 4771, 4776]), Value)
      | where IpAddress == Value
      | project TimeGenerated, Account = iff(isempty(TargetDomainName) or TargetDomainName == "-", TargetSam, tolower(strcat(TargetDomainName, @"\", TargetSam))),
          Source = SourceTable, Success = EventID !in (4625, 4771) and Status in ("", "-", "0x0"),
          Target = TargetHost, AuthBy = AuthAuthority, App = "", Detail = strcat(tostring(EventID), " ", LogonTypeName, " ", Status)
  ),
  // @sentinel-only:end
  (
      DeviceLogonEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where RemoteIP == Value
      | project TimeGenerated, Account = tolower(strcat(AccountDomain, @"\", AccountName)), Source = "DeviceLogonEvents",
          Success = ActionType == "LogonSuccess", Target = tolower(DeviceName), AuthBy = "", App = "", Detail = strcat(LogonType, " ", FailureReason)
  ),
  (
      IdentityLogonEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where IPAddress == Value
      | project TimeGenerated, Account = tolower(coalesce(AccountUpn, AccountName)), Source = "IdentityLogonEvents",
          Success = ActionType == "LogonSuccess", Target = tolower(TargetDeviceName), AuthBy = tolower(DestinationDeviceName),
          App = Application, Detail = strcat(Protocol, " ", FailureReason)
  )
  // @sentinel-only:begin
  , (
      ASimAuthenticationEventLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where SrcIpAddr == Value
      | project TimeGenerated, Account = tolower(TargetUsername), Source = strcat("ASIM ", EventProduct), Success = EventResult == "Success",
          Target = tolower(coalesce(TargetHostname, DvcHostname)), AuthBy = "", App = TargetAppName, Detail = strcat(LogonProtocol, " ", EventResultDetails)
  ),
  (
      Syslog
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where SyslogMessage has Value and ProcessName in~ ("sshd", "sshd-session")
      | extend User = extract(@"(?:Accepted|Failed) \S+ for (?:invalid user )?(\S+) from", 1, SyslogMessage)
      | where isnotempty(User)
      | project TimeGenerated, Account = tolower(User), Source = "Syslog (sshd)", Success = SyslogMessage startswith "Accepted",
          Target = tolower(Computer), AuthBy = "", App = "SSH", Detail = substring(SyslogMessage, 0, 200)
  )
  // @sentinel-only:end
  | where isnotempty(Account) and Account !endswith "$"
  | extend MachineKey = _HostKey(Target), AccountKey = _SamOf(Account)
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | lookup kind=leftouter (_AccountRoles(EndTimestamp)) on AccountKey
  | summarize Attempts = count(), Successes = countif(Success), Failures = countif(not(Success)),
      FirstSeen = min(TimeGenerated), FirstSuccess = minif(TimeGenerated, Success), LastSeen = max(TimeGenerated),
      Targets = make_set_if(_Labeled(Target, MachineRole), isnotempty(Target), 20), ValidatedBy = make_set_if(AuthBy, isnotempty(AuthBy), 5),
      Apps = make_set_if(App, isnotempty(App), 10), Sources = make_set(Source), Details = make_set(Detail, 10),
      AccountRole = take_any(_JoinRoles(_AccountKind(AccountKey), AccountRole)) by Account
  | sort by Successes desc, Attempts desc
