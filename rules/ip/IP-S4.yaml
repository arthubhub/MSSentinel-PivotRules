id: IP-S4
name: Daily usage by account
indicators: [ip]
action: statistics
targets: [account]
description: >
  Account × day cross-table of the number of events linking the IP to an account (Entra ID sign-ins of users and
  applications, Windows, Defender and Linux logons, Microsoft 365, Azure, Microsoft Graph). The known role of the
  account (service account, privileged group, machine or system account, watchlist) is shown in brackets.
reading:
  decisive: Dozens or hundreds of different accounts with 1 to 3 attempts each (password spray).
  context: A single account with a very large number of attempts (brute force), or a privileged account among the accounts seen.
  noise: Corporate NAT or VPN IP shared by many legitimate users; service accounts at fixed times.
window: { before: 7d, after: 1d }
uses: [ip_events, roles]
query: |
  _IpEvents(StartTimestamp, EndTimestamp, Value)
  | where isnotempty(Account) and Account != "-"
  | extend AccountKey = _SamOf(Account)
  | lookup kind=leftouter (_AccountRoles(EndTimestamp)) on AccountKey
  | extend Account = _Labeled(Account, _JoinRoles(_AccountKind(AccountKey), AccountRole))
  | summarize Events = count() by Account, Day = format_datetime(bin(TimeGenerated, 1d), "yyyy-MM-dd")
  | evaluate pivot(Day, sum(Events), Account)
