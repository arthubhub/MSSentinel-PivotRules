id: IP-S2
name: Volume per 10 minutes, by table and event
indicators: [ip]
action: statistics
description: >
  Number of events containing the IP per 10-minute bucket, broken down by table and event type
  (EventID, ActionType or operation). Shows a spike of failures, regular beaconing or unusual activity.
reading:
  decisive: Spike of 4625 failures or ResultType 50126 within a few minutes, followed by a success.
  context: Regular intervals between network events (C2 beaconing).
  noise: Corporate NAT, internal scanners and gateways that produce a constant background.
scenarios: [S1, S6]
v1: true
window: { before: 24h, after: 1h }
render: timechart
uses: [ip_events]
query: |
  _IpEvents(StartTimestamp, EndTimestamp, Value)
  | summarize Events = count() by bin(TimeGenerated, 10m), Serie = strcat(Source, " · ", EventType)
  | render timechart
