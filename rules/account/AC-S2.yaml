id: AC-S2
name: Échecs et succès d'authentification par heure
indicators: [account]
action: statistics
description: >
  Courbe horaire des succès et échecs d'authentification du compte, une série par source et par point de vue :
  Entra ID, ouvertures de session Windows sur les machines (4624, 4625), validations d'identifiants par les contrôleurs
  de domaine (4768, 4771, 4776, séparées pour ne pas doubler chaque ouverture de session), Defender for Endpoint,
  Defender for Identity, ASIM et SSH Linux.
reading:
  decisive: Série d'échecs suivie d'un succès, ou succès Entra ID juste après une rafale d'échecs MFA.
  context: Échecs nocturnes réguliers ; échecs de validation au DC sans session ouverte (mot de passe testé ailleurs).
  noise: Compte de service au mot de passe expiré qui échoue à heure fixe depuis la même machine.
window: { before: 24h, after: 1h }
render: timechart
uses: [signins, win_security]
query: |
  union isfuzzy=true
  (
      _Signins(StartTimestampstamp, EndTimestampstamp, "", ValueUpn)
      | project TimeGenerated, Serie = strcat("Entra ID · ", iff(Succeeded, "succès", "échec"))
  ),
  (
      _WinSecurity(StartTimestampstamp, EndTimestampstamp, dynamic([4624, 4625, 4768, 4771, 4776]), ValueSam)
      | where TargetSam == ValueSam
      | project TimeGenerated, Serie = strcat(iff(EventID in (4624, 4625), "Windows session · ", "Windows validation DC · "),
          iff(EventID in (4625, 4771) or Status !in ("", "-", "0x0"), "échec", "succès"))
  ),
  (
      DeviceLogonEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where AccountName =~ ValueSam
      | project TimeGenerated, Serie = strcat("Defender · ", iff(ActionType == "LogonSuccess", "succès", "échec"))
  ),
  (
      IdentityLogonEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where AccountUpn =~ ValueUpn or AccountName =~ ValueSam
      | project TimeGenerated, Serie = strcat("Defender for Identity · ", iff(ActionType == "LogonSuccess", "succès", "échec"))
  ),
  (
      ASimAuthenticationEventLogs
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where TargetUsername has ValueSam
      | where tolower(TargetUsername) in (ValueSam, ValueUpn) or tolower(TargetUsername) endswith strcat(@"\", ValueSam)
      | project TimeGenerated, Serie = strcat("ASIM ", EventProduct, " · ", iff(EventResult == "Success", "succès", "échec"))
  ),
  (
      Syslog
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where ProcessName in~ ("sshd", "sshd-session") and SyslogMessage has ValueSam
      | where tolower(extract(@"(?:Accepted|Failed) \S+ for (?:invalid user )?(\S+) from", 1, SyslogMessage)) == ValueSam
      | project TimeGenerated, Serie = strcat("SSH · ", iff(SyslogMessage startswith "Accepted", "succès", "échec"))
  )
  | summarize Events = count() by bin(TimeGenerated, 1h), Serie
  | render timechart
