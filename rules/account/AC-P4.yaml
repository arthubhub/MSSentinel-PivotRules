id: AC-P4
name: Mailbox rules, consents and MFA methods
indicators: [account]
action: pivot
targets: [ip, application]
description: >
  Persistence changes on a cloud account: mailbox rules and forwarding (New-InboxRule, Set-Mailbox,
  UpdateInboxRules…), mailbox delegations, OAuth consents and granted permissions, added authentication
  methods, password and role changes.
reading:
  decisive: Forwarding or redirect rule to an external address, or consent to an unknown application, shortly after a suspicious sign-in.
  context: Rule that moves or deletes messages containing "invoice", "payment" or the name of the help desk.
  noise: Out-of-office replies, shared mailboxes, MFA registration after a phone change.
v1: true
window: { before: 7d, after: 1d }
query: |
  let MailboxOps = dynamic(["New-InboxRule", "Set-InboxRule", "UpdateInboxRules", "Set-Mailbox", "Add-MailboxPermission",
      "Add-RecipientPermission", "Set-MailboxJunkEmailConfiguration", "New-TransportRule", "Set-TransportRule"]);
  let EntraOps = dynamic(["Consent to application", "Add delegated permission grant", "Add app role assignment grant to user",
      "Add app role assignment to service principal", "Add service principal", "Add service principal credentials",
      "Add owner to application", "User registered security info", "User registered all required security info",
      "Admin registered security info", "User changed default security info", "Reset password (by admin)",
      "Change user password", "Add member to role", "Add eligible member to role"]);
  let Flag = (text:string) {
      case(text has_any ("ForwardTo", "RedirectTo", "ForwardingSmtpAddress", "ForwardingAddress", "ForwardAsAttachmentTo"), "Forwarding or redirect",
          text has_any ("DeleteMessage", "MoveToFolder", "MarkAsRead", "SoftDeleteMessage"), "Deletion or hiding",
          "")
  };
  union isfuzzy=true
  // @sentinel-only:begin
  (
      OfficeActivity
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where Operation in (MailboxOps)
      | where UserId =~ ValueUpn or Parameters has ValueUpn
      | project TimeGenerated, Source = "OfficeActivity", Operation, Detail = substring(Parameters, 0, 1000), IP = ClientIP, Flag = Flag(Parameters)
  ),
  // @sentinel-only:end
  (
      CloudAppEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where ActionType in (MailboxOps)
      | where tostring(RawEventData.UserId) =~ ValueUpn or RawEventData has ValueUpn
      | extend Params = tostring(RawEventData.Parameters)
      | project TimeGenerated, Source = "CloudAppEvents", Operation = ActionType, Detail = substring(Params, 0, 1000), IP = IPAddress, Flag = Flag(Params)
  )
  // @sentinel-only:begin
  , (
      AuditLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where OperationName in (EntraOps) or OperationName has "Certificates and secrets management"
      | where InitiatedBy has ValueUpn or TargetResources has ValueUpn
      | extend Changes = tostring(TargetResources[0].modifiedProperties)
      | project TimeGenerated, Source = "AuditLogs", Operation = OperationName,
          Detail = substring(strcat(tostring(TargetResources[0].displayName), " · ", Changes), 0, 1000),
          IP = tostring(InitiatedBy.user.ipAddress),
          Flag = case(OperationName has "Consent" or OperationName has "permission grant", "OAuth consent",
              OperationName has "security info", "Authentication method",
              OperationName has "password", "Password",
              OperationName has "role", "Role", "")
  )
  // @sentinel-only:end
  // @defender-only:begin
  // Defender XDR: no AuditLogs; the same Entra ID operations appear in CloudAppEvents (name followed by a period)
  , (
      CloudAppEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where ActionType has_any (EntraOps) or ActionType has "Certificates and secrets management"
      | where tostring(RawEventData.UserId) =~ ValueUpn or RawEventData has ValueUpn
      | extend Changes = tostring(RawEventData.ModifiedProperties)
      | project TimeGenerated, Source = "CloudAppEvents", Operation = ActionType,
          Detail = substring(strcat(ObjectName, " · ", Changes), 0, 1000), IP = IPAddress,
          Flag = case(ActionType has "Consent" or ActionType has "permission grant", "OAuth consent",
              ActionType has "security info", "Authentication method",
              ActionType has "password", "Password",
              ActionType has "role", "Role", "")
  )
  // @defender-only:end
  | sort by TimeGenerated asc
