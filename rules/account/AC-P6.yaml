id: AC-P6
name: Files and shares accessed by the account
indicators: [account]
action: pivot
targets: [device, process, ip]
description: >
  Files and shares read, written, deleted or whose permissions changed, by the account, grouped by device,
  folder and access kind:
  Windows object access audit (4656, 4663, 4670, and 4660 linked to the file by its handle) on devices where
  a SACL is set, network share access (5140, 5145) logged by file servers, files created,
  modified or deleted seen by Defender for Endpoint and by Sysmon (11, 15, 23, 26), ASIM file logs, and
  SharePoint or OneDrive files (OfficeActivity). Reads are only visible in the Windows and SharePoint audit:
  Defender for Endpoint and Sysmon do not log reads.
reading:
  decisive: Bulk read or download on a share or in SharePoint shortly before an outbound connection or an archive (exfiltration).
  context: Access to administrative shares (C$, ADMIN$) or to sensitive folders outside the account's scope; permissions changed.
  noise: Roaming profiles, folder redirection, OneDrive sync, antivirus and backup.
window: { before: 24h, after: 1h }
uses: [win_security, sysmon, roles]
query: |
  // @sentinel-only:begin
  let Win = materialize(_WinSecurity(StartTimestamp, EndTimestamp, dynamic([4656, 4660, 4663, 4670, 5140, 5145]), ValueSam)
      | where SubjectSam == ValueSam
      | where EventID in (5140, 5145) or ObjectType in ("File", ""));
  let Handles = Win | where EventID in (4656, 4663) and isnotempty(HandleId) | summarize HandleObject = take_any(ObjectName) by Computer, HandleId;
  // @sentinel-only:end
  union isfuzzy=true
  // @sentinel-only:begin
  (
      Win
      | join kind=leftouter (Handles) on Computer, HandleId
      | project TimeGenerated, Source = SourceTable, Machine = tolower(Computer),
          Kind = iff(EventID in (5140, 5145), "Network share", "File (Windows audit)"),
          Object = case(EventID == 5145, strcat(@"\\", tolower(Computer), @"\", trim(@"[\\*]+", ShareName), @"\", RelativeTargetName),
              EventID == 5140, strcat(@"\\", tolower(Computer), @"\", trim(@"[\\*]+", ShareName)),
              coalesce(ObjectName, HandleObject)),
          Access = ObjectAccess, Process = tolower(tostring(split(ProcessName, @"\")[-1])), SourceIp = IpAddress
  ),
  // @sentinel-only:end
  (
      DeviceFileEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where InitiatingProcessAccountName =~ ValueSam or RequestAccountName =~ ValueSam
      | project TimeGenerated, Source = "DeviceFileEvents", Machine = tolower(DeviceName),
          Kind = iff(RequestProtocol == "Smb", "Network share (Defender)", "File (Defender)"), Object = FolderPath,
          Access = case(ActionType == "FileDeleted", "delete", ActionType == "FileRenamed", "rename", "write"),
          Process = tolower(InitiatingProcessFileName), SourceIp = RequestSourceIP
  )
  // @defender-only:begin
  // Defender XDR: equivalents of 5140/5145 (Defender for Endpoint events carrying a share name) and of
  // OfficeActivity (SharePoint and OneDrive files seen by Defender for Cloud Apps)
  , (
      DeviceEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where AdditionalFields has "ShareName"
      | where AccountName =~ ValueSam or InitiatingProcessAccountName =~ ValueSam
      | extend Share = trim(@"[\\*]+", tostring(parse_json(tostring(AdditionalFields)).ShareName))
      | where isnotempty(Share)
      | project TimeGenerated, Source = strcat("DeviceEvents · ", ActionType), Machine = tolower(DeviceName), Kind = "Network share (Defender)",
          Object = strcat(@"\\", tolower(DeviceName), @"\", Share, iff(isnotempty(FileName), strcat(@"\", FileName), "")),
          Access = ActionType, Process = tolower(InitiatingProcessFileName), SourceIp = RemoteIP
  ),
  (
      CloudAppEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | extend Workload = tostring(RawEventData.Workload)
      | where Workload in ("SharePoint", "OneDrive")
      | where tostring(RawEventData.UserId) =~ ValueUpn
      | where ActionType has_any ("FileAccessed", "FileDownloaded", "FileSyncDownloadedFull", "FileModified", "FileUploaded", "FileDeleted",
          "FileMoved", "FileCopied", "SharingSet", "AnonymousLinkCreated", "SecureLinkCreated")
      | project TimeGenerated, Source = "CloudAppEvents", Machine = tolower(Workload), Kind = strcat(Workload, " (Microsoft 365)"),
          Object = coalesce(tostring(RawEventData.ObjectId), ObjectName),
          Access = case(ActionType has_any ("Accessed", "Downloaded"), "read", ActionType has "Deleted", "delete",
              ActionType has_any ("Sharing", "Link"), "share", "write"),
          Process = UserAgent, SourceIp = IPAddress
  )
  // @defender-only:end
  // @sentinel-only:begin
  , (
      _Sysmon(StartTimestamp, EndTimestamp, dynamic([11, 15, 23, 26]), ValueSam)
      | where UserSam == ValueSam
      | project TimeGenerated, Source = strcat("Sysmon ", tostring(EventID)), Machine = tolower(Computer), Kind = "File (Sysmon)",
          Object = TargetFilename, Access = iff(EventID in (23, 26), "delete", "write"), Process = ProcessFile, SourceIp = ""
  ),
  (
      ASimFileEventLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where ActorUsername has ValueSam
      | where tolower(ActorUsername) in (ValueSam, ValueUpn) or tolower(ActorUsername) endswith strcat(@"\", ValueSam)
      | project TimeGenerated, Source = strcat("ASIM ", EventProduct), Machine = tolower(DvcHostname), Kind = "File (ASIM)",
          Object = TargetFilePath, Access = tolower(EventType), Process = tolower(tostring(split(ActingProcessName, @"\")[-1])), SourceIp = SrcIpAddr
  ),
  (
      OfficeActivity
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where OfficeWorkload in ("SharePoint", "OneDrive")
      | where UserId =~ ValueUpn
      | where Operation has_any ("FileAccessed", "FileDownloaded", "FileSyncDownloadedFull", "FileModified", "FileUploaded", "FileDeleted",
          "FileMoved", "FileCopied", "SharingSet", "AnonymousLinkCreated", "SecureLinkCreated")
      | project TimeGenerated, Source = "OfficeActivity", Machine = tolower(OfficeWorkload), Kind = strcat(OfficeWorkload, " (Microsoft 365)"),
          Object = OfficeObjectId,
          Access = case(Operation has_any ("Accessed", "Downloaded"), "read", Operation has "Deleted", "delete",
              Operation has_any ("Sharing", "Link"), "share", "write"),
          Process = tostring(UserAgent), SourceIp = ClientIP
  )
  // @sentinel-only:end
  | where isnotempty(Object)
  | extend Folder = tostring(parse_path(Object).DirectoryPath), File = tostring(parse_path(Object).Filename)
  | extend MachineKey = _HostKey(Machine)
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | summarize Events = count(), Files = dcount(Object), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      SampleFiles = make_set(File, 10), Processes = make_set_if(Process, isnotempty(Process), 5),
      SourceIps = make_set_if(SourceIp, isnotempty(SourceIp), 5), Sources = make_set(Source)
      by Machine, MachineRole, Kind, Folder = coalesce(Folder, Object), Access
  | sort by Files desc, FirstSeen asc
