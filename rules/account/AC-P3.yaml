id: AC-P3
name: Actions d'administration et de fichiers du compte
indicators: [account]
action: pivot
description: >
  Opérations réalisées par le compte, ou qui le visent : audit Entra ID (AuditLogs), Microsoft 365
  (OfficeActivity et CloudAppEvents, qui se recoupent selon les connecteurs activés), Azure Resource Manager et appels
  Microsoft Graph (MicrosoftGraphActivityLogs, rattachés au compte par son identifiant d'objet trouvé dans ses connexions).
reading:
  decisive: Ajout d'une méthode MFA, attribution de rôle, lecture massive de fichiers ou de secrets juste après une connexion suspecte.
  context: Opérations sur des ressources hors du périmètre habituel du compte.
  noise: Synchronisation OneDrive, opérations d'administration planifiées, comptes d'automatisation.
v1: true
window: { before: 4h, after: 4h }
uses: [signins]
query: |
  let UserIds = _Signins(StartTimestamp - 1d, EndTimestamp, "", ValueUpn) | where isnotempty(UserId) | distinct UserId;
  union isfuzzy=true
  (
      MicrosoftGraphActivityLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where UserId in (UserIds)
      | project TimeGenerated, Source = "MicrosoftGraphActivityLogs", Operation = strcat(RequestMethod, " ",
              replace_regex(tostring(parse_url(RequestUri).Path), @"[0-9a-fA-F-]{36}", "{id}")),
          Role = "Auteur", Target = AppId, Result = tostring(ResponseStatusCode), IP = IPAddress
  ),
  (
      AuditLogs
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where InitiatedBy has ValueUpn or TargetResources has ValueUpn
      | project TimeGenerated, Source = "AuditLogs (Entra ID)", Operation = OperationName,
          Role = iff(tostring(InitiatedBy.user.userPrincipalName) =~ ValueUpn, "Auteur", "Cible"),
          Target = coalesce(tostring(TargetResources[0].userPrincipalName), tostring(TargetResources[0].displayName)),
          Result, IP = tostring(InitiatedBy.user.ipAddress)
  ),
  (
      OfficeActivity
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where UserId =~ ValueUpn
      | project TimeGenerated, Source = strcat("OfficeActivity (", OfficeWorkload, ")"), Operation, Role = "Auteur",
          Target = coalesce(OfficeObjectId, SourceFileName), Result = ResultStatus, IP = ClientIP
  ),
  (
      CloudAppEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where tostring(RawEventData.UserId) =~ ValueUpn
      | project TimeGenerated, Source = strcat("CloudAppEvents (", Application, ")"), Operation = ActionType, Role = "Auteur",
          Target = ObjectName, Result = "", IP = IPAddress
  ),
  (
      AzureActivity
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where Caller =~ ValueUpn
      | project TimeGenerated, Source = "AzureActivity", Operation = OperationNameValue, Role = "Auteur",
          Target = _ResourceId, Result = ActivityStatusValue, IP = CallerIpAddress
  )
  | summarize Events = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      Targets = make_set(Target, 10), IPs = make_set(IP, 5), Results = make_set(Result, 5) by Source, Operation, Role
  | sort by Events desc
