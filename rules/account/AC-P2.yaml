id: AC-P2
name: Machines où le compte s'est connecté
indicators: [account]
action: pivot
description: >
  Machines liées au compte, classées par nature du lien (colonne Perspective) pour ne pas confondre la machine
  utilisée avec le contrôleur de domaine qui a validé les identifiants :
  1. « Session sur la machine » : ouverture de session sur la machine elle-même (Defender for Endpoint, 4624 et 4625 de
  la machine, Defender for Identity, ASIM, SSH) ;
  2. « Identifiants explicites vers la machine » : 4648 (runas, connexion avec d'autres identifiants), la machine est le
  serveur visé ;
  3. « Ticket de service Kerberos » : 4769 journalisé par le DC pour un service de la machine (partage, RDP, WinRM…), seule
  trace quand la machine elle-même n'envoie pas ses journaux ;
  4. « Poste d'origine (vu par le DC) » : poste ou IP depuis lequel le compte s'est authentifié (4768, 4769, 4771, 4776,
  Defender for Identity) ;
  5. « Accès réseau au contrôleur de domaine » : ouverture réseau (type 3) sur un DC (stratégies de groupe, SYSVOL, LDAP),
  présente pour tout compte du domaine, classée en dernier.
  Le rôle de chaque machine (DC détecté, watchlist EasyPivotRoles) est indiqué, et ValidatedBy liste les DC qui ont
  validé les identifiants.
reading:
  decisive: Compte standard en session sur des serveurs sensibles ou des contrôleurs de domaine (type 2 ou 10) hors de son périmètre.
  context: Ouvertures RemoteInteractive (RDP) ou NewCredentials (runas /netonly) inhabituelles ; tickets 4769 vers un serveur jamais vu.
  noise: Accès réseau aux DC (GPO, SYSVOL), postes partagés, serveurs de fichiers ou d'impression en ouverture réseau (type 3).
v1: true
window: { before: 24h, after: 1h }
uses: [win_security, roles]
query: |
  let Win = materialize(_WinSecurity(StartTimestampstamp, EndTimestampstamp, dynamic([4624, 4625, 4648, 4768, 4769, 4771, 4776]), ValueSam)
      | where TargetSam == ValueSam);
  union isfuzzy=true
  (
      DeviceLogonEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where AccountName =~ ValueSam
      | project TimeGenerated, Machine = tolower(DeviceName), Perspective = "Session sur la machine", Source = "DeviceLogonEvents",
          LogonType, Success = ActionType == "LogonSuccess", SourceIp = RemoteIP, SourceHost = tolower(RemoteDeviceName), AuthBy = "",
          IsLocalAdmin
  ),
  (
      Win
      | where EventID in (4624, 4625, 4648)
      | project TimeGenerated, Machine = TargetHost,
          Perspective = iff(EventID == 4648, "Identifiants explicites vers la machine", "Session sur la machine"),
          Source = SourceTable, LogonType = iff(EventID == 4648, "Identifiants explicites (4648)", LogonTypeName),
          Success = EventID != 4625, SourceIp = IpAddress, SourceHost = iff(EventID == 4648, tolower(Computer), tolower(WorkstationName)),
          AuthBy = "", IsLocalAdmin = bool(null)
  ),
  (
      Win
      | where EventID == 4769 and isnotempty(TargetHost)
      | project TimeGenerated, Machine = TargetHost, Perspective = "Ticket de service Kerberos (vu par le DC)", Source = SourceTable,
          LogonType = strcat("Kerberos · ", ServiceName), Success = Status in ("", "-", "0x0"), SourceIp = IpAddress, SourceHost = "",
          AuthBy = AuthAuthority, IsLocalAdmin = bool(null)
  ),
  (
      Win
      | where EventID in (4768, 4769, 4771, 4776) and isnotempty(SourceHost)
      | project TimeGenerated, Machine = SourceHost, Perspective = "Poste d'origine (vu par le DC)", Source = SourceTable,
          LogonType = strcat(tostring(EventID), " ", EventName), Success = EventID != 4771 and Status in ("", "-", "0x0"),
          SourceIp = IpAddress, SourceHost = "", AuthBy = AuthAuthority, IsLocalAdmin = bool(null)
  ),
  (
      IdentityLogonEvents
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where AccountUpn =~ ValueUpn or AccountName =~ ValueSam
      | extend Pair = pack_array(
          bag_pack("Machine", tolower(TargetDeviceName), "Perspective", "Session sur la machine"),
          bag_pack("Machine", tolower(DeviceName), "Perspective", "Poste d'origine (vu par le DC)"))
      | mv-expand Pair
      | project TimeGenerated, Machine = tostring(Pair.Machine), Perspective = tostring(Pair.Perspective), Source = "IdentityLogonEvents",
          LogonType = strcat(Protocol, " ", LogonType), Success = ActionType == "LogonSuccess", SourceIp = IPAddress,
          SourceHost = iff(tostring(Pair.Perspective) startswith "Session", tolower(DeviceName), ""), AuthBy = tolower(DestinationDeviceName),
          IsLocalAdmin = bool(null)
  ),
  (
      ASimAuthenticationEventLogs
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where TargetUsername has ValueSam
      | where tolower(TargetUsername) in (ValueSam, ValueUpn) or tolower(TargetUsername) endswith strcat(@"\", ValueSam)
      | project TimeGenerated, Machine = tolower(coalesce(TargetHostname, DvcHostname)), Perspective = "Session sur la machine",
          Source = strcat("ASIM ", EventProduct), LogonType = strcat(LogonProtocol, " ", LogonMethod), Success = EventResult == "Success",
          SourceIp = SrcIpAddr, SourceHost = tolower(SrcHostname), AuthBy = "", IsLocalAdmin = bool(null)
  ),
  (
      Syslog
      | where TimeGenerated between (StartTimestampstamp .. EndTimestampstamp)
      | where ProcessName in~ ("sshd", "sshd-session") and SyslogMessage has ValueSam
      | extend User = extract(@"(?:Accepted|Failed) \S+ for (?:invalid user )?(\S+) from", 1, SyslogMessage)
      | where tolower(User) == ValueSam
      | project TimeGenerated, Machine = tolower(Computer), Perspective = "Session sur la machine", Source = "Syslog (sshd)",
          LogonType = "SSH", Success = SyslogMessage startswith "Accepted",
          SourceIp = extract(@" from (\S+)", 1, SyslogMessage), SourceHost = "", AuthBy = "", IsLocalAdmin = bool(null)
  )
  | where isnotempty(Machine) and Machine != "-"
  | extend MachineKey = _HostKey(Machine)
  | lookup kind=leftouter (_MachineRoles(EndTimestampstamp)) on MachineKey
  | extend Perspective = iff(MachineRole has "DC" and Perspective == "Session sur la machine" and LogonType has "Network",
      "Accès réseau au contrôleur de domaine (GPO, SYSVOL, LDAP)", Perspective)
  | extend Rank = case(Perspective startswith "Session", 1, Perspective startswith "Identifiants", 2, Perspective startswith "Ticket", 3,
      Perspective startswith "Poste", 4, 5)
  | summarize Logons = count(), Failures = countif(not(Success)), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      LogonTypes = make_set(LogonType, 10), SourceIps = make_set_if(SourceIp, isnotempty(SourceIp), 10),
      SourceHosts = make_set_if(SourceHost, isnotempty(SourceHost), 10), ValidatedBy = make_set_if(AuthBy, isnotempty(AuthBy), 5),
      Sources = make_set(Source), LocalAdmin = max(toint(IsLocalAdmin)) by Machine, MachineRole, Perspective, Rank
  | sort by Rank asc, FirstSeen asc
  | project-away Rank
