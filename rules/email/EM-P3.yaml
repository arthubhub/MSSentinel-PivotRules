id: EM-P3
name: Network connections of the user around T0
indicators: [email]
action: pivot
targets: [device, process, url, ip]
description: >
  Defender network connections (DeviceNetworkEvents) started by the user's processes, 5 minutes
  before and after T0 by default (time of the click, for instance). The match uses the process UPN, or otherwise
  the local part of the address (approximation when the Windows account name differs). MachineRole gives the known
  role of the device (an RDS or Citrix server hosts sessions from many users).
reading:
  decisive: Connection to the domain of the email or of the fake CAPTCHA, followed by a connection from a non-browser process.
  context: Public destinations never seen elsewhere in the fleet.
  noise: Background traffic from the browser, Teams and update agents.
window: { before: 5m, after: 5m }
uses: [roles]
query: |
  DeviceNetworkEvents
  | where TimeGenerated between (StartTimestamp .. EndTimestamp)
  | where InitiatingProcessAccountUpn =~ ValueMail
      or (isempty(InitiatingProcessAccountUpn) and InitiatingProcessAccountName =~ ValueMailLocal)
  | where RemoteIPType != "Loopback"
  | project TimeGenerated, DeviceName, ActionType, Process = InitiatingProcessFileName, CommandLine = InitiatingProcessCommandLine,
      RemoteUrl, RemoteIP, RemotePort, RemoteIPType, Protocol
  | extend MachineKey = _HostKey(DeviceName)
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | project-away MachineKey, MachineRoleBasis
  | sort by TimeGenerated asc
