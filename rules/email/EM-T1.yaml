id: EM-T1
name: Email, click, download, network, process timeline
indicators: [email]
action: timeline
targets: [device, url, ip]
description: >
  Full chain around T0 for the user: received emails, clicks, downloaded files, first contact
  with each public destination and processes started from Explorer, a browser or Office. Host carries the
  known role of the device (DC, declared RDS server…).
reading:
  decisive: Email → click → download or pasted command → process (powershell, mshta, script) → outbound connection.
  context: Short delay (under 5 minutes) between the click and the first unusual process.
  noise: Ordinary browsing, Office documents opened from Outlook.
window: { before: 30m, after: 30m }
uses: [roles]
query: |
  let Launchers = dynamic(["explorer.exe", "chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe", "outlook.exe",
      "olk.exe", "winword.exe", "excel.exe", "powerpnt.exe", "onenote.exe", "ms-teams.exe", "teams.exe"]);
  let IsUser = (upn:string, name:string) { upn =~ ValueMail or (isempty(upn) and name =~ ValueMailLocal) };
  union isfuzzy=true
  (
      EmailEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where RecipientEmailAddress =~ ValueMail
      | project TimeGenerated, Source = "EmailEvents", Host = "", Account = ValueMail, Action = "Email received",
          Detail = strcat(SenderFromAddress, " · ", Subject, " · ", DeliveryAction, " ", ThreatTypes)
  ),
  (
      UrlClickEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where AccountUpn =~ ValueMail
      | project TimeGenerated, Source = "UrlClickEvents", Host = "", Account = ValueMail, Action = strcat("Click ", ActionType), Detail = Url
  ),
  (
      DeviceFileEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where IsUser(InitiatingProcessAccountUpn, InitiatingProcessAccountName)
      | where isnotempty(FileOriginUrl) or FolderPath has @"\Downloads\"
      | project TimeGenerated, Source = "DeviceFileEvents", Host = tolower(DeviceName), Account = ValueMail,
          Action = strcat("File ", ActionType), Detail = strcat(FolderPath, " ← ", FileOriginUrl, " · ", InitiatingProcessFileName)
  ),
  (
      DeviceProcessEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where IsUser(AccountUpn, AccountName)
      | where InitiatingProcessFileName in~ (Launchers)
      | project TimeGenerated, Source = "DeviceProcessEvents", Host = tolower(DeviceName), Account = ValueMail,
          Action = strcat("Process ", FileName), Detail = strcat(InitiatingProcessFileName, " → ", ProcessCommandLine)
  ),
  (
      DeviceNetworkEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where IsUser(InitiatingProcessAccountUpn, InitiatingProcessAccountName)
      | where RemoteIPType == "Public"
      | summarize TimeGenerated = min(TimeGenerated) by DeviceName, InitiatingProcessFileName, Destination = coalesce(RemoteUrl, RemoteIP), RemotePort
      | project TimeGenerated, Source = "DeviceNetworkEvents", Host = tolower(DeviceName), Account = ValueMail,
          Action = strcat("First contact · ", InitiatingProcessFileName), Detail = strcat(Destination, ":", tostring(RemotePort))
  )
  | extend MachineKey = _HostKey(Host)
  | lookup kind=leftouter (_MachineRoles(EndTimestamp)) on MachineKey
  | extend Host = _Labeled(Host, MachineRole)
  | project-away MachineKey, MachineRole, MachineRoleBasis
  | sort by TimeGenerated asc
