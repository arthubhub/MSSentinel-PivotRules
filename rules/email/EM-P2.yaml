id: EM-P2
name: Link clicks around T0
indicators: [email]
action: pivot
targets: [url, ip, email]
description: >
  Clicks recorded by link protection for the address (UrlClickEvents), 30 minutes before and
  after T0 by default, matched with the source email (sender, subject, time received).
reading:
  decisive: Allowed click (ClickAllowed) or click forced through the warning (IsClickedThrough) on the URL of the suspicious message.
  context: Click from Teams or Office rather than from Outlook.
  noise: Clicks by security scanners a few seconds after delivery, from datacenter IPs.
window: { before: 30m, after: 30m }
query: |
  UrlClickEvents
  | where TimeGenerated between (StartTimestamp .. EndTimestamp)
  | where AccountUpn =~ ValueMail
  | join kind=leftouter (
      EmailEvents
      | where TimeGenerated between ((StartTimestamp - 7d) .. EndTimestamp)
      | where RecipientEmailAddress =~ ValueMail
      | summarize arg_min(TimeGenerated, Subject, SenderFromAddress) by NetworkMessageId
      | project NetworkMessageId, MailTime = TimeGenerated, Subject, SenderFromAddress
      ) on NetworkMessageId
  | project TimeGenerated, Url, ActionType, IsClickedThrough, Workload, ThreatTypes, DetectionMethods, IPAddress,
      MailTime, SenderFromAddress, Subject, UrlChain, NetworkMessageId
  | sort by TimeGenerated asc
