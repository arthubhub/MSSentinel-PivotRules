id: EM-P7
name: Teams messages involving the address
indicators: [email]
action: pivot
targets: [email]
description: >
  Teams messages and chats sent by the address or including it: MessageEvents (Defender for Office 365,
  if available), Teams audit from OfficeActivity and CloudAppEvents. Shows whether the thread is external.
reading:
  decisive: Sender from an external tenant posing as the help desk, contacting several employees within the hour.
  context: First exchange with this sender, generic display name (Help Desk, IT Support).
  noise: Chats with known partners and vendors.
window: { before: 4h, after: 1h }
query: |
  union isfuzzy=true
  (
      MessageEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where SenderEmailAddress =~ ValueMail or RecipientDetails has ValueMail
      | project TimeGenerated, Source = "MessageEvents", Sender = SenderEmailAddress, SenderName = SenderDisplayName, SenderType,
          Recipients = tostring(RecipientDetails), Subject = coalesce(MessageSubject, Subject), Thread = ThreadName,
          ExternalThread = tostring(IsExternalThread), Action = DeliveryAction, ThreatTypes
  ),
  // @sentinel-only:begin
  (
      OfficeActivity
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where OfficeWorkload == "MicrosoftTeams"
      | where UserId =~ ValueMail or Members has ValueMail
      | project TimeGenerated, Source = "OfficeActivity", Sender = UserId, SenderName = "", SenderType = UserType,
          Recipients = tostring(Members), Subject = ChatName, Thread = ChatThreadId, ExternalThread = "",
          Action = Operation, ThreatTypes = ""
  ),
  // @sentinel-only:end
  (
      CloudAppEvents
      | where TimeGenerated between (StartTimestamp .. EndTimestamp)
      | where Application == "Microsoft Teams"
      | where RawEventData has ValueMail
      | project TimeGenerated, Source = "CloudAppEvents", Sender = tostring(RawEventData.UserId), SenderName = AccountDisplayName,
          SenderType = AccountType, Recipients = tostring(RawEventData.Members), Subject = tostring(RawEventData.ChatName),
          Thread = tostring(RawEventData.ChatThreadId), ExternalThread = tostring(IsExternalUser), Action = ActionType, ThreatTypes = ""
  )
  | sort by TimeGenerated asc
