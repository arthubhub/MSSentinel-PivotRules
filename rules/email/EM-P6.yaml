id: EM-P6
name: Messages sent to the address
indicators: [email]
action: pivot
targets: [email]
description: >
  Senders who sent messages to the address: useful when the address is the target of a forwarding
  rule (external address). Shows the direction (outbound), the number of forwarded messages and the subjects.
reading:
  decisive: Outbound messages to an external address right after a forwarding rule was created.
  context: Forwarding from several mailboxes to the same external address.
  noise: Authorized forwarding to partners, copies to ticketing tools.
window: { before: 7d, after: 1d }
query: |
  EmailEvents
  | where TimeGenerated between (StartTimestamp .. EndTimestamp)
  | where RecipientEmailAddress =~ ValueMail
  | summarize Mails = count(), Forwarded = countif(isnotempty(ForwardingInformation)), FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated), Subjects = make_set(Subject, 20), Directions = make_set(EmailDirection),
      Actions = make_set(DeliveryAction) by SenderFromAddress
  | extend Outbound = set_has_element(Directions, "Outbound")
  | sort by Outbound desc, FirstSeen asc
