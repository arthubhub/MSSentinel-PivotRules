id: EM-S1
name: Daily message volume by verdict
indicators: [email]
action: statistics
description: >
  Number of emails received and sent by the address, per day, split by delivery action and detected threat
  type (EmailEvents).
reading:
  decisive: Spike of outbound messages from the address (compromised account spreading phishing internally or externally).
  context: Rise in messages quarantined or flagged as Phish sent to the address.
  noise: Newsletters and automatic notifications, end-of-month bursts.
window: { before: 7d, after: 1d }
render: timechart
query: |
  EmailEvents
  | where TimeGenerated between (StartTimestamp .. EndTimestamp)
  | where RecipientEmailAddress =~ ValueMail or SenderFromAddress =~ ValueMail or SenderMailFromAddress =~ ValueMail
  | extend Role = iff(RecipientEmailAddress =~ ValueMail, "Received", "Sent"),
      Verdict = iff(isempty(ThreatTypes), DeliveryAction, strcat(DeliveryAction, " · ", ThreatTypes))
  | summarize Mails = count() by bin(TimeGenerated, 1d), Serie = strcat(Role, " · ", Verdict)
  | render timechart
